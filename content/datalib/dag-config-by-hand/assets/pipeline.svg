<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="-apple-system, system-ui, sans-serif">
  <text x="320" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">The pipeline this tutorial builds</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="166" y1="72" x2="232" y2="72"/>
    <line x1="166" y1="172" x2="232" y2="172"/>
    <line x1="374" y1="72" x2="452" y2="112"/>
    <line x1="374" y1="172" x2="452" y2="136"/>
  </g>
  <rect x="24" y="52" width="142" height="40" rx="8" fill="#eef2f7" stroke="#64748b"/>
  <text x="95" y="77" text-anchor="middle" font-size="13" fill="#1f2328">commands/fetch</text>
  <rect x="24" y="152" width="142" height="40" rx="8" fill="#eef2f7" stroke="#64748b"/>
  <text x="95" y="177" text-anchor="middle" font-size="13" fill="#1f2328">formats/fetch</text>
  <rect x="232" y="52" width="142" height="40" rx="8" fill="#e6effe" stroke="#2563eb"/>
  <text x="303" y="77" text-anchor="middle" font-size="13" fill="#1f2328">commands/count</text>
  <rect x="232" y="152" width="142" height="40" rx="8" fill="#e6effe" stroke="#2563eb"/>
  <text x="303" y="177" text-anchor="middle" font-size="13" fill="#1f2328">formats/count</text>
  <rect x="454" y="104" width="142" height="40" rx="8" fill="#eaf4ee" stroke="#2f6f4f"/>
  <text x="525" y="129" text-anchor="middle" font-size="13" fill="#1f2328">report/all</text>
  <text x="95" y="112" text-anchor="middle" font-size="11" fill="#4b5563">copy-folder (shell)</text>
  <text x="303" y="112" text-anchor="middle" font-size="11" fill="#4b5563">word-count (Python)</text>
  <text x="525" y="164" text-anchor="middle" font-size="11" fill="#4b5563">merge-counts (Python)</text>
  <text x="320" y="226" text-anchor="middle" font-size="12" fill="#4b5563">Each box is a step: one program writing one directory, named by its id.</text>
  <text x="320" y="243" text-anchor="middle" font-size="12" fill="#4b5563">An arrow means the step on the right lists the left one in its inputs.</text>
</svg>
