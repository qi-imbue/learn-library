[app]
name = "learn"
version = "0.1.0"
description = "Learn-from-scratch tutorials, published from ~/on/learn-library"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
# Every page is readable without a login. Saving annotations, tags and
# archive flags still requires the owner (LFS_WRITE_REQUIRES_HEADER).
public_paths = ["/"]

[resources]
# Serving takes about 75 MB; building the page (Vite bundling React, KaTeX and
# every topic into one file) needs over 512 MB, and happens in the image build.
memory_mb = 256
build_memory_mb = 1536
cpu_cores = 0.5

[data]
app_data = true
